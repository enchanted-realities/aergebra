<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aergebra — live geometry for agents and humans</title>
  <meta name="description" content="Agents and humans sharing live geometry instead of screenshots. The page registers 16 WebMCP tools (document.modelContext) so an agent can construct, label, point, and read the board as data — on the same receipted board a human works." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232bb5a0' stroke-width='3'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="/aergebra/assets/index-d83Q9dVp.js"></script>
  <link rel="stylesheet" crossorigin href="/aergebra/assets/index-C5K8NKz9.css">
</head>
<body>
  <div id="app">
    <!-- Topbar transplanted from the v8 shell (aergebra-v8-src/app/page.tsx:1346-1401): brand mark,
         wordmark, divider, project name; then the three file verbs — Save / Import / Export. -->
    <header id="topbar">
      <div class="brand-group">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-name">Aergebra</span>
        <span class="top-divider" aria-hidden="true"></span>
        <input id="doc-title" class="project-name" type="text" value="Untitled project" aria-label="Project title" />
      </div>
      <div class="file-actions">
        <button id="btn-save"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span>Save</span></button>
        <button id="btn-import"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span>Import</span></button>
        <input id="file-import" type="file" accept=".json,.aergebra.json,.scu,.ggb,.svg,.png,.jpg,.jpeg,.webp,image/*" hidden />
        <details class="export-menu">
          <summary><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>Export</span></summary>
          <div class="export-options">
            <button id="btn-export-scu">SCU</button>
            <button id="btn-export-svg">SVG</button>
          </div>
        </details>
      </div>
    </header>
    <main id="workspace">
      <nav id="toolrail" aria-label="Creation tools"></nav>
      <section id="canvas-wrap">
        <div id="board"></div>
        <div id="state-legend" aria-label="Colour meaning legend">
          <i class="sw sw-charcoal" title="charcoal — at rest"></i>at rest
          <i class="sw sw-brown" title="brown — blocked"></i>blocked
          <i class="sw sw-orange" title="orange — ready"></i>ready
          <i class="sw sw-teal" title="teal — willing"></i>willing
        </div>
        <div id="status-hint"></div>
      </section>
      <aside id="inspector" aria-label="Inspector"></aside>
    </main>
    <footer id="bottombar">
      <div id="status-row"><span id="status">SCU7 · station by station</span><span id="webmcp-badge" title="Web Model Context tools this page offers to agents"></span></div>
      <div id="cmdline-row">
        <span id="cmdline-prompt">Aergebra&gt;</span>
        <input id="cmdline-input" type="text" placeholder="createPoint(2,3)" aria-label="Aergebra command line" autocomplete="off" />
        <button id="cmdline-run">Run</button>
      </div>
      <div id="cmdline-output"></div>
    </footer>
  </div>
</body>
</html>
